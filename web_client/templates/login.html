{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block anon %}
<div class="auth">
  <div class="card">
    <div class="brand">
      <span class="mark">L&amp;S</span>
      <span class="name">Ledger &amp; Spine</span>
    </div>
    {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" value="{{ username|default('') }}"
               autocomplete="username" autofocus required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" required />
      </div>
      <button class="btn primary" type="submit" style="width:100%">Sign in</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:var(--space-4);font-size:var(--text-xs)">
      Staff access only · Bookstore Management System
    </p>
  </div>
</div>
{% endblock %}
