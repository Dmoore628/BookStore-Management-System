[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookstore-management-system"
version = "1.0.0"
description = "Ledger & Spine — staff bookstore inventory, cart/POS, and order management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Damian J. Moore" },
  { name = "Richard Mora" },
  { name = "Stephen Merten" },
  { name = "Daniel Richards" },
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2.0",
  "bcrypt>=4.2.0",
  "cryptography>=44.0.0",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "hypothesis>=6.112.0",
  "schemathesis>=3.38.0",
  "playwright>=1.48.0",
  "pytest-playwright>=0.5.2",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "bandit>=1.8.0",
  "pip-audit>=2.7.0",
  "mutmut>=3.2.0",
  "openpyxl>=3.1.5",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api_server*", "web_client*", "domain_services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=. --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "e2e: end-to-end browser tests (require a running app + Playwright browsers)",
  "load: performance/load tests (run manually or on schedule)",
]

[tool.coverage.run]
source = ["api_server", "web_client", "domain_services"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["api_server", "web_client", "domain_services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
packages = ["api_server", "web_client", "domain_services"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
